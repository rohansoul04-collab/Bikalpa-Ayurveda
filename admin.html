<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developed by Bogati Tech</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="fav-icon.jpg">
    
    <!-- Google Fonts: Inter for a clean, modern, legible look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#0B4A9A',     // Primary logo blue
                            light: '#479EE6',    // Accent logo blue
                            dark: '#0f172a',     // Slate 900 for text
                            gray: '#64748b',     // Slate 500 for secondary text
                            bg: '#f8fafc',       // Slate 50 for background
                        }
                    },
                    boxShadow: {
                        'soft': '0 20px 40px -15px rgba(11, 74, 154, 0.1)',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes cyber-spin {
            0% { transform: perspective(1000px) rotateY(0deg); }
            100% { transform: perspective(1000px) rotateY(360deg); }
        }
        .animate-cyber-spin {
            animation: cyber-spin 8s linear infinite;
            transform-style: preserve-3d;
        }
        .cyber-glow {
            box-shadow: 0 0 20px rgba(71, 158, 230, 0.6), inset 0 0 15px rgba(11, 74, 154, 0.4);
            border: 2px solid rgba(71, 158, 230, 0.8);
        }
    </style>
</head>
<body class="bg-brand-bg font-sans antialiased text-brand-dark min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Subtle background decoration (CSS only, professional look) -->
    <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-brand-blue/5 to-transparent -z-10"></div>
    <div class="absolute -top-24 -right-24 w-96 h-96 bg-brand-light/10 rounded-full blur-3xl -z-10"></div>
    <div class="absolute -bottom-24 -left-24 w-96 h-96 bg-brand-blue/10 rounded-full blur-3xl -z-10"></div>

    <main class="w-full max-w-lg">
        <!-- Professional Card Container -->
        <div class="bg-white rounded-2xl shadow-soft border border-slate-100 overflow-hidden relative">
            
            <!-- Top accent bar -->
            <div class="h-2 w-full bg-gradient-to-r from-brand-blue to-brand-light"></div>
            
            <div class="p-8 sm:p-12 text-center flex flex-col items-center">
                
                <!-- Logo Container -->
                <div class="w-36 h-36 sm:w-44 sm:h-44 mb-8 rounded-full bg-white flex items-center justify-center p-2 cyber-glow animate-cyber-spin relative">
                    <!-- Added inner dashed ring for extra cyber feel -->
                    <div class="absolute inset-1 rounded-full border border-dashed border-brand-light/50 animate-[spin_10s_linear_infinite_reverse]"></div>
                    <img src="fav-icon.jpg" 
                         alt="Bogati Tech" 
                         class="w-full h-full object-cover rounded-full shadow-inner z-10"
                         onerror="this.onerror=null; this.src='image_772c19.jpg';">
                </div>

                <!-- Typography Section -->
                <div class="space-y-3 mb-8">
                    <p class="text-sm font-semibold tracking-widest text-brand-light uppercase">
                        Project Infrastructure
                    </p>
                    
                    <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 leading-tight">
                        Designed & Developed by
                    </h1>
                    
                    <p class="text-3xl sm:text-4xl font-extrabold text-brand-blue tracking-tight pt-1">
                        Bogati Tech
                    </p>
                </div>

                <p class="text-brand-gray text-sm sm:text-base leading-relaxed max-w-sm mb-10">
                    This platform is currently running on our secure development infrastructure. We build high-performance, scalable web solutions.
                </p>

                <!-- Action Button -->
                <a href="https://bikalpaayurveda.com.np/" class="inline-flex items-center justify-center px-8 py-3.5 text-sm font-semibold text-white transition-all duration-300 bg-gradient-to-r from-brand-blue to-brand-light rounded-full shadow-lg hover:shadow-[0_0_20px_rgba(71,158,230,0.5)] hover:-translate-y-1 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-blue">
                    Return Home
                    <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                </a>
            </div>
            
            <!-- Bottom Footer Area inside card -->
            <div class="bg-slate-50 py-4 text-center border-t border-slate-100">
                <p class="text-xs text-slate-400 font-medium">
                    &copy; <script>document.write(new Date().getFullYear())</script> Bogati Tech. All rights reserved.
                </p>
            </div>
        </div>
    </main>

</body>
</html>
